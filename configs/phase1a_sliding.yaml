# Phase 1a Variant B — metaplastic sliding threshold (BCM-style).
#
# HELD historical arm. Primary specialization A/B found B_NO_HELP (sliding ≈
# fixed; within-arm seed spread ≫ between-arm Δ). Official product recipe is
# configs/phase1a_fixed.yaml (fixed + gated_novelty + gap_imprinted).
# Birth/trigger knobs below match the locked stack for fair re-runs if needed.
# Do not retune mu after a multi-seed run.

seed: 0
device: auto

model:
  input_dim: 784
  hidden_init: [256, 128, 64]
  hidden_max: [512, 256, 128]
  num_classes: 10

train:
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  batch_size: 128
  epochs: 20
  epochs_a: 15
  epochs_b: 15

data:
  root: data/mnist
  num_workers: 2

plasticity:
  threshold_kind: sliding
  radius: 0.35
  # Per-layer r*_ℓ from 1-epoch ActivationMagnitude mean EMA (probe).
  target_rates:
    h1: 0.77
    h2: 1.02
    h3: 1.28
  tau: 0.5           # edge_tau_floor / shared scale — locked with Variant A pre-primary sweep
  edge_eligibility_mode: neither_contraction
  # grace_steps >= birth_bias_steps so judgment never mixes residual scaffold bias.
  newborn_grace_steps: 3
  newborn_ema_init: layer_target
  newborn_birth_bias: 0.5
  newborn_birth_bias_steps: 3
  newborn_weight_init: gap_imprinted
  newborn_parent_noise: 0.0
  newborn_copy_outgoing: true
  newborn_parent_coord_jitter: 0.05
  newborn_lr_mult: 1.0
  neuron_growth_trigger: gated_novelty
  novelty_k_min: 11
  novelty_rank_fraction: 1.0
  mu: 0.999
  prune_edge_fraction: 0.05
  prune_neuron_z: -1.0
  max_new_edges_per_layer: 64
  max_new_neurons_per_layer: 4
  seed_edges_per_new_neuron: 4
  cadence: epoch

tasks:
  shift_type: label_permutation
  permutation_seed: 123

experiment:
  variant: sliding
  seeds: [0, 1, 2]
  output_dir: results/phase1a_sliding
  conditions: [stationary, task_shift]
  record_structure_snapshots: false
  structure_snapshot_cadence: every_epoch

smoke:
  train:
    epochs: 1
    epochs_a: 1
    epochs_b: 1
    batch_size: 64
