name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache MNIST data
        uses: actions/cache@v4
        with:
          path: data/mnist
          key: mnist-v1-${{ runner.os }}
          restore-keys: |
            mnist-v1-${{ runner.os }}

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
        env:
          # Keep torch deterministic-ish; MNIST downloads land under data/mnist.
          PYTHONUNBUFFERED: "1"

      - name: Phase 0 dry-run (smoke plan)
        # Full --smoke training can exceed a few minutes on CPU; dry-run
        # validates CLI/config wiring without training or writing verdict.
        run: >
          python scripts/run_phase0.py
          --config configs/default.yaml
          --smoke
          --condition stationary
          --dry-run
