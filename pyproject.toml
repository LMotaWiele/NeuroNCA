[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuronca"
version = "0.1.0"
description = "NeuroNCA: structural plasticity research (Phase 0–1a closed)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/neuronca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
